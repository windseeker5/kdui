<!doctype html>
<html lang="en" class="{% block html_class %}{% endblock %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KD UI{% endblock %}</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('kdui.static', filename='kdui/css/output.css') }}">
  <link rel="stylesheet" href="{{ url_for('kdui.static', filename='kdui/css/kdui.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-background text-foreground">
  {% block body %}{% endblock %}
  <script src="{{ url_for('kdui.static', filename='kdui/js/vendor/basecoat.all.min.js') }}" defer></script>
  <script src="{{ url_for('kdui.static', filename='kdui/js/components/command_search.js') }}" defer></script>
  <script src="{{ url_for('kdui.static', filename='kdui/js/components/file_upload.js') }}" defer></script>
  <script src="{{ url_for('kdui.static', filename='kdui/js/components/data_table.js') }}" defer></script>
  <script src="{{ url_for('kdui.static', filename='kdui/js/components/kpi_card.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
