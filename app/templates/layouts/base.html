<!doctype html>
<html lang="en" class="{% block html_class %}{% endblock %}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Flask Shadcn Starter{% endblock %}</title>

  <!-- Prevent theme flash: apply saved theme before first paint (Basecoat convention) -->
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kdui.css') }}" />
  {% block head %}{% endblock %}
</head>
<body class="bg-background text-foreground min-h-screen">
  {% block body %}{% endblock %}

  {% block vendor_scripts %}
    <script src="{{ url_for('static', filename='js/vendor/basecoat.all.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/components/file_upload.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/components/data_table.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/components/kpi_card.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
